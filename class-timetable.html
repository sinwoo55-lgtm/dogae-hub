<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>학급 시간표 제작 · 도개중고등학교</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <style>
    :root{--navy:#253E8A;--deep:#17245D;--pale:#EEF2FB;--bg:#F3F5FA;--surface:#fff;--line:#DCE2F0;--text:#1B253D;--muted:#68748A}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif}.head{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 clamp(16px,4vw,52px);gap:14px}.back{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;text-decoration:none;color:var(--navy);font-size:24px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;object-fit:contain}.brand b{display:block;color:var(--deep);font-family:'Noto Serif KR',serif}.brand small{color:var(--muted);font-size:9px;letter-spacing:.1em}.shell{width:min(1500px,calc(100% - 36px));margin:26px auto 50px}.title{margin:0 0 18px;color:var(--deep);font:700 29px 'Noto Serif KR',serif}.workspace{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 7px 24px rgba(35,57,120,.06)}.controls{position:sticky;top:86px;display:grid;gap:18px}.group{display:grid;gap:8px}.group-title{color:var(--deep);font-size:12px;font-weight:800}.field,select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 11px;color:var(--text);font:13px inherit;outline:0}.field:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(37,62,138,.1)}.row{display:flex;gap:7px}.row>*{flex:1}.btn{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--navy);padding:0 11px;font:700 12px inherit;cursor:pointer;white-space:nowrap}.btn:hover{background:var(--pale)}.btn.primary{border-color:var(--navy);background:var(--navy);color:#fff}.btn.danger{color:#B4232D}.btn:disabled{opacity:.45;cursor:default}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.swatch{aspect-ratio:1;border:2px solid transparent;border-radius:9px;padding:3px;background:transparent;cursor:pointer}.swatch span{display:block;width:100%;height:100%;border-radius:6px}.swatch.active{border-color:var(--navy)}.swatch[data-theme=blue] span{background:linear-gradient(135deg,#D7E5F5 50%,#FFFCEF 50%)}.swatch[data-theme=green] span{background:linear-gradient(135deg,#D8EBE2 50%,#FFFDF5 50%)}.swatch[data-theme=peach] span{background:linear-gradient(135deg,#F7DCCB 50%,#FFF9F0 50%)}.swatch[data-theme=lavender] span{background:linear-gradient(135deg,#E2DCF5 50%,#FFFDF8 50%)}.swatch[data-theme=mono] span{background:linear-gradient(135deg,#E2E5E9 50%,#fff 50%)}.range-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}.range-row input{width:100%;accent-color:var(--navy)}.range-row output{min-width:32px;color:var(--muted);font-size:11px;text-align:right}.note{color:var(--muted);font-size:10px;line-height:1.55}.status{min-height:18px;color:var(--muted);font-size:11px}.status.ok{color:#16784F}.status.error{color:#B4232D}.preview{min-width:0;padding:18px;overflow:auto}.sheet{--paper:#FFFCEF;--head:#D7E5F5;--grid:#263A5F;--ink:#101827;position:relative;isolation:isolate;width:min(720px,100%);min-width:560px;aspect-ratio:155088/239896;margin:0 auto;background:var(--paper);border:4px solid var(--grid);overflow:hidden;box-shadow:0 12px 28px rgba(18,31,68,.13)}.sheet::before{content:"";position:absolute;inset:0;z-index:0;background-image:var(--custom-image,none);background-size:cover;background-position:center;opacity:var(--image-opacity,0);pointer-events:none}.theme-green{--paper:#FFFDF5;--head:#D8EBE2;--grid:#24473B;--ink:#15342B}.theme-peach{--paper:#FFF9F0;--head:#F7DCCB;--grid:#65392B;--ink:#45251D}.theme-lavender{--paper:#FFFDF8;--head:#E2DCF5;--grid:#403762;--ink:#30284C}.theme-mono{--paper:#fff;--head:#E2E5E9;--grid:#24272B;--ink:#151719}.tt-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%}.tt-cell{min-width:0;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);display:flex;align-items:center;justify-content:center;color:var(--ink)}.tt-cell:nth-child(6n){border-right:0}.tt-cell:nth-last-child(-n+6){border-bottom:0}.tt-head,.tt-period{background:color-mix(in srgb,var(--head) 88%,transparent);font-weight:800}.tt-head{font-size:clamp(18px,2.2vw,31px)}.tt-period{font-size:clamp(18px,2.5vw,34px)}.corner{position:relative;background:color-mix(in srgb,var(--head) 88%,transparent)}.corner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.3%,var(--grid) 49.6%,var(--grid) 50.4%,transparent 50.7%)}.corner span{position:absolute;z-index:1;font-weight:800;font-size:clamp(9px,1.1vw,14px)}.corner .day-label{right:9%;top:12%}.corner .period-label{left:8%;bottom:12%}.slot{display:grid;grid-template-rows:1fr 1fr;align-items:center;width:100%;height:100%;padding:7% 5%;background:color-mix(in srgb,var(--paper) 82%,transparent)}.slot:focus-within{box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--grid) 45%,transparent);background:color-mix(in srgb,var(--paper) 95%,transparent)}.slot input{display:block;width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);text-align:center;font-family:'Noto Sans KR',sans-serif}.slot .subject{align-self:end;padding-bottom:3px;font-size:clamp(13px,1.45vw,21px);font-weight:800}.slot .teacher{align-self:start;padding-top:3px;font-size:clamp(10px,1.1vw,15px);font-weight:500}.slot input::placeholder{color:color-mix(in srgb,var(--ink) 35%,transparent)}html[data-theme=dark] body{--bg:#111827;--surface:#1A2233;--line:#37445B;--text:#E7ECF7;--muted:#AAB6CB;--deep:#F4F7FF;--pale:#263553}html[data-theme=dark] .head{background:#1A2233}html[data-theme=dark] .field,html[data-theme=dark] select,html[data-theme=dark] .btn{background:#202B40;color:#DDE7FF;border-color:#4A5C7C}html[data-theme=dark] .btn.primary{background:#526FC8;border-color:#7894E7;color:#fff}html[data-theme=dark] .preview{background:#171F2F}.sheet,html[data-theme=dark] .sheet{color-scheme:light}@media(max-width:980px){.workspace{grid-template-columns:1fr}.controls{position:static}.control-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.preview{padding:10px}}@media(max-width:600px){.shell{width:calc(100% - 20px);margin-top:18px}.title{font-size:24px}.panel{padding:15px}.control-columns{grid-template-columns:1fr}.sheet{min-width:520px}.preview{overflow:auto}.row.stack-mobile{flex-direction:column}}
    @media print{@page{size:A4 portrait;margin:10mm}body{background:#fff}.hub-topbar,.head,.title,.controls{display:none!important}.shell,.workspace,.preview{display:block!important;width:auto!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important;background:#fff!important}.sheet{width:100%!important;min-width:0!important;max-height:calc(100vh - 2mm);margin:auto;box-shadow:none}.slot input::placeholder{color:transparent}}
  </style>
</head>
<body>
  <header class="head"><a class="back" href="index.html">‹</a><div class="brand"><img src="logo.png" alt="도개중고등학교 로고"><div><b>도개중고등학교</b><small>CLASS TIMETABLE MAKER</small></div></div></header>
  <main class="shell"><h1 class="title">학급 시간표 제작</h1><div class="workspace">
    <aside class="panel controls"><div class="control-columns">
      <section class="group"><span class="group-title">시간표 이름</span><input class="field" id="titleInput" maxlength="40" value="1학년 1반" placeholder="예: 1학년 1반"><div class="row"><button class="btn primary" id="saveBtn">서버에 저장</button><button class="btn" id="newBtn">새로 만들기</button></div></section>
      <section class="group"><span class="group-title">저장된 시간표</span><select id="savedList"><option value="">불러올 시간표 선택</option></select><div class="row"><button class="btn" id="loadBtn" disabled>불러오기</button><button class="btn danger" id="deleteBtn" disabled>삭제</button></div></section>
      <section class="group"><span class="group-title">컬러 테마</span><div class="palette" id="palette"><button class="swatch active" data-theme="blue" title="파랑"><span></span></button><button class="swatch" data-theme="green" title="초록"><span></span></button><button class="swatch" data-theme="peach" title="살구"><span></span></button><button class="swatch" data-theme="lavender" title="보라"><span></span></button><button class="swatch" data-theme="mono" title="흑백"><span></span></button></div></section>
      <section class="group"><span class="group-title">배경 이미지</span><div class="row"><button class="btn" id="imageBtn">이미지 선택</button><button class="btn" id="imageClearBtn" disabled>이미지 제거</button></div><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden><div class="range-row"><input id="opacityInput" type="range" min="0" max="0.5" step="0.05" value="0.15"><output id="opacityValue">15%</output></div><span class="note">이미지는 자동으로 용량을 줄여 저장합니다. 글자가 잘 보이도록 투명도를 조절하세요.</span></section>
      <section class="group"><span class="group-title">파일로 저장</span><div class="row stack-mobile"><select id="paperSize" aria-label="출력 용지"><option value="A4">A4 세로</option><option value="A3">A3 세로</option></select><button class="btn" id="pngBtn">PNG 저장</button><button class="btn" id="printBtn">인쇄·PDF</button></div><span class="note">인쇄 창에서 PDF로 저장할 수 있습니다.</span></section>
    </div><div class="status" id="status" aria-live="polite"></div></aside>
    <section class="panel preview"><div class="sheet theme-blue" id="sheet"><div class="tt-grid" id="grid"></div></div></section>
  </div></main>
  <script>
    const $=id=>document.getElementById(id),days=['월','화','수','목','금'],themes={blue:{paper:'#FFFCEF',head:'#D7E5F5',grid:'#263A5F',ink:'#101827'},green:{paper:'#FFFDF5',head:'#D8EBE2',grid:'#24473B',ink:'#15342B'},peach:{paper:'#FFF9F0',head:'#F7DCCB',grid:'#65392B',ink:'#45251D'},lavender:{paper:'#FFFDF8',head:'#E2DCF5',grid:'#403762',ink:'#30284C'},mono:{paper:'#FFFFFF',head:'#E2E5E9',grid:'#24272B',ink:'#151719'}};
    let currentId='',theme='blue',backgroundImage='',savedItems=[];
    function setStatus(message,type=''){$('status').textContent=message;$('status').className='status '+type}
    function buildGrid(){let html='<div class="tt-cell corner"><span class="day-label">요일</span><span class="period-label">교시</span></div>'+days.map(day=>`<div class="tt-cell tt-head">${day}</div>`).join('');for(let period=1;period<=7;period++){html+=`<div class="tt-cell tt-period">${period}</div>`;for(let day=0;day<5;day++)html+=`<label class="tt-cell slot"><input class="subject" maxlength="30" aria-label="${days[day]}요일 ${period}교시 과목" placeholder="과목명"><input class="teacher" maxlength="30" aria-label="${days[day]}요일 ${period}교시 교사" placeholder="교사"></label>`}$('grid').innerHTML=html}
    function inputs(){return [...document.querySelectorAll('.slot')].map(slot=>({subject:slot.querySelector('.subject').value.trim(),teacher:slot.querySelector('.teacher').value.trim()}))}
    function fillCells(cells){document.querySelectorAll('.slot').forEach((slot,index)=>{slot.querySelector('.subject').value=cells?.[index]?.subject||'';slot.querySelector('.teacher').value=cells?.[index]?.teacher||''})}
    function applyTheme(next){theme=themes[next]?next:'blue';$('sheet').className='sheet theme-'+theme;document.querySelectorAll('.swatch').forEach(button=>button.classList.toggle('active',button.dataset.theme===theme))}
    function applyImage(){$('sheet').style.setProperty('--custom-image',backgroundImage?`url("${backgroundImage}")`:'none');$('sheet').style.setProperty('--image-opacity',$('opacityInput').value);$('imageClearBtn').disabled=!backgroundImage;$('opacityValue').value=Math.round(Number($('opacityInput').value)*100)+'%'}
    function data(){return{title:$('titleInput').value.trim(),theme,backgroundImage,backgroundOpacity:Number($('opacityInput').value),cells:inputs()}}
    async function request(url,options){const response=await fetch(url,options),payload=await response.json();if(!response.ok)throw Error(payload.error||'요청을 처리하지 못했습니다.');return payload}
    function updateButtons(){$('loadBtn').disabled=!$('savedList').value;$('deleteBtn').disabled=!$('savedList').value}
    async function loadList(selected=currentId){try{const payload=await request('/api/dashboard?scope=class-timetables');savedItems=payload.items||[];$('savedList').innerHTML='<option value="">불러올 시간표 선택</option>'+savedItems.map(item=>`<option value="${item.id}" ${item.id===selected?'selected':''}>${String(item.title).replace(/[&<>]/g,'')}</option>`).join('');updateButtons()}catch(error){setStatus(error.message,'error')}}
    async function save(){const next=data();if(!next.title)return setStatus('시간표 이름을 입력해주세요.','error');const button=$('saveBtn'),label=button.textContent;button.disabled=true;button.textContent='저장 중…';try{const payload=await request('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'class-timetable:save',id:currentId||undefined,data:next})});currentId=payload.item.id;await loadList(currentId);setStatus('시간표를 서버에 저장했습니다.','ok')}catch(error){setStatus(error.message,'error')}finally{button.disabled=false;button.textContent=label}}
    async function loadSelected(){const id=$('savedList').value;if(!id)return;setStatus('시간표를 불러오는 중입니다.');try{const payload=await request('/api/dashboard?scope=class-timetables&id='+encodeURIComponent(id));if(!payload.item)throw Error('저장된 시간표를 찾을 수 없습니다.');const item=payload.item;currentId=item.id;$('titleInput').value=item.title;applyTheme(item.theme);backgroundImage=item.backgroundImage||'';$('opacityInput').value=Number(item.backgroundOpacity)||0;fillCells(item.cells);applyImage();setStatus('저장된 시간표를 불러왔습니다.','ok')}catch(error){setStatus(error.message,'error')}}
    function reset(){currentId='';$('savedList').value='';$('titleInput').value='1학년 1반';applyTheme('blue');backgroundImage='';$('opacityInput').value=.15;fillCells([]);applyImage();updateButtons();setStatus('새 시간표를 만들 수 있습니다.')}
    async function removeSelected(){const id=$('savedList').value,item=savedItems.find(row=>row.id===id);if(!id||!confirm(`${item?.title||'선택한 시간표'}를 삭제할까요?`))return;try{await request('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'class-timetable:delete',id})});if(currentId===id)reset();await loadList();setStatus('저장된 시간표를 삭제했습니다.','ok')}catch(error){setStatus(error.message,'error')}}
    async function imageData(file){if(!file?.type.startsWith('image/'))throw Error('이미지 파일을 선택해주세요.');const url=URL.createObjectURL(file);try{const image=await new Promise((resolve,reject)=>{const item=new Image();item.onload=()=>resolve(item);item.onerror=()=>reject(Error('이미지를 읽지 못했습니다.'));item.src=url});let scale=Math.min(1,1400/Math.max(image.width,image.height)),width=Math.max(1,Math.round(image.width*scale)),height=Math.max(1,Math.round(image.height*scale));for(let attempt=0;attempt<3;attempt++){const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(image,0,0,width,height);const result=canvas.toDataURL('image/jpeg',attempt?0.62:0.78);if(result.length<=620000)return result;width=Math.round(width*.75);height=Math.round(height*.75)}throw Error('이미지 용량을 줄이지 못했습니다. 다른 이미지를 선택해주세요.')}finally{URL.revokeObjectURL(url)}}
    async function drawPng(){const width=1400,height=Math.round(width*239896/155088),cellW=width/6,cellH=height/8,p=themes[theme],canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=width;canvas.height=height;ctx.fillStyle=p.paper;ctx.fillRect(0,0,width,height);if(backgroundImage){const image=await new Promise((resolve,reject)=>{const item=new Image();item.onload=()=>resolve(item);item.onerror=reject;item.src=backgroundImage}),scale=Math.max(width/image.width,height/image.height),w=image.width*scale,h=image.height*scale;ctx.save();ctx.globalAlpha=Number($('opacityInput').value);ctx.drawImage(image,(width-w)/2,(height-h)/2,w,h);ctx.restore()}ctx.fillStyle=p.head;ctx.globalAlpha=.88;ctx.fillRect(0,0,width,cellH);ctx.fillRect(0,0,cellW,height);ctx.globalAlpha=1;ctx.strokeStyle=p.grid;ctx.lineWidth=2;for(let col=0;col<=6;col++){ctx.beginPath();ctx.moveTo(col*cellW,0);ctx.lineTo(col*cellW,height);ctx.stroke()}for(let row=0;row<=8;row++){ctx.beginPath();ctx.moveTo(0,row*cellH);ctx.lineTo(width,row*cellH);ctx.stroke()}ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,width-3,height-3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(cellW,cellH);ctx.stroke();ctx.fillStyle=p.ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 54px "Noto Sans KR"';days.forEach((day,index)=>ctx.fillText(day,(index+1.5)*cellW,cellH/2));ctx.font='800 48px "Noto Sans KR"';for(let period=1;period<=7;period++)ctx.fillText(String(period),cellW/2,(period+.5)*cellH);ctx.font='800 27px "Noto Sans KR"';ctx.fillText('요일',cellW*.72,cellH*.26);ctx.fillText('교시',cellW*.28,cellH*.74);inputs().forEach((cell,index)=>{const col=index%5+1,row=Math.floor(index/5)+1,x=(col+.5)*cellW,y=(row+.5)*cellH;ctx.font='800 37px "Noto Sans KR"';ctx.fillText(cell.subject,x,y-23,cellW-18);ctx.font='500 27px "Noto Sans KR"';ctx.fillText(cell.teacher,x,y+30,cellW-18)});const link=document.createElement('a');link.download=($('titleInput').value.trim()||'학급 시간표').replace(/[\\/:*?"<>|]/g,'_')+'.png';link.href=canvas.toDataURL('image/png');link.click();setStatus('PNG 파일을 저장했습니다.','ok')}
    buildGrid();applyImage();loadList();document.querySelectorAll('.swatch').forEach(button=>button.onclick=()=>applyTheme(button.dataset.theme));$('opacityInput').oninput=applyImage;$('imageBtn').onclick=()=>$('imageInput').click();$('imageInput').onchange=async event=>{try{backgroundImage=await imageData(event.target.files[0]);applyImage();setStatus('배경 이미지를 적용했습니다.','ok')}catch(error){setStatus(error.message,'error')}finally{event.target.value=''}};$('imageClearBtn').onclick=()=>{backgroundImage='';applyImage();setStatus('배경 이미지를 제거했습니다.')};$('savedList').onchange=updateButtons;$('loadBtn').onclick=loadSelected;$('deleteBtn').onclick=removeSelected;$('saveBtn').onclick=save;$('newBtn').onclick=reset;$('pngBtn').onclick=()=>drawPng().catch(()=>setStatus('PNG 파일을 만들지 못했습니다.','error'));$('printBtn').onclick=()=>{const style=document.createElement('style');style.id='dynamicPage';style.textContent=`@page{size:${$('paperSize').value} portrait;margin:10mm}`;document.getElementById('dynamicPage')?.remove();document.head.appendChild(style);window.print()};
  </script>
  <script src="nav.js"></script>
</body></html>
