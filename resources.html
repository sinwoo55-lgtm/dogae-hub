<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>유용한 자료 모음 · 도개중고등학교</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#253E8A;--deep:#17245D;--pale:#EEF2FB;--bg:#F3F5FA;--line:#DCE2F0;--text:#1B253D;--muted:#68748A}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif}.head{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 clamp(16px,4vw,52px);gap:14px}.back{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;text-decoration:none;color:var(--navy);font-size:23px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:35px;height:35px}.brand b,.title,.link-card h2{font-family:'Noto Serif KR',serif;color:var(--deep)}.brand b{font-size:16px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.shell{width:100%;padding:42px clamp(16px,4vw,52px) 60px}.eyebrow{color:var(--navy);font-size:11px;font-weight:700;letter-spacing:.12em}.title{font-size:clamp(27px,4vw,38px);margin:7px 0}.intro{color:var(--muted);font-size:13px;margin:0 0 27px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px}.admin-add{border:0;border-radius:9px;background:#16784F;color:#fff;padding:10px 13px;font:700 12px 'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap}.admin-add[hidden]{display:none}.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:0 15px;box-shadow:0 6px 20px rgba(26,43,91,.05)}.search svg{width:18px;color:var(--muted)}.search input{width:100%;border:0;outline:0;padding:15px 0;font:inherit;font-size:14px;background:transparent}.result{font-size:12px;color:var(--muted);margin:16px 2px}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-left:5px solid var(--color,#16784F);border-radius:13px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;transition:.18s;cursor:pointer}.item:hover{transform:translateX(3px);box-shadow:0 9px 24px rgba(25,43,106,.1);border-color:var(--color,#16784F)}.item h2{font-size:16px;margin:0 0 6px;color:var(--deep);word-break:keep-all}.item p{font-size:13px;line-height:1.6;color:var(--muted);margin:0;word-break:keep-all}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.tag{border-radius:999px;padding:3px 7px;background:#E8F6F0;color:#16784F;font-size:10px;font-weight:700}.go{color:#16784F;font-size:13px;font-weight:700;white-space:nowrap}.item-tools{display:flex;gap:6px;opacity:0;transition:.16s}.item:hover .item-tools,.item:focus-within .item-tools{opacity:1}.item-tools button{border:1px solid var(--line);border-radius:7px;background:#fff;color:#B4232D;padding:6px 8px;font:700 11px 'Noto Sans KR',sans-serif;cursor:pointer}.empty{background:#fff;border:1px dashed #B8C3DB;border-radius:13px;text-align:center;padding:80px 20px;color:var(--muted);font-size:13px}.link-modal{position:fixed;inset:0;z-index:950;background:rgba(13,24,56,.38);display:grid;place-items:center;padding:18px}.link-modal[hidden]{display:none}.link-card{width:min(500px,100%);border-radius:16px;background:#fff;padding:24px;box-shadow:0 20px 55px rgba(12,24,59,.25)}.link-card h2{margin:0 0 15px;font-size:20px}.link-card label{display:block;margin:11px 0 5px;font-size:12px;font-weight:700}.link-card input,.link-card textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}.link-card textarea{min-height:86px;resize:vertical}.note{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.6}.link-form-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}.link-form-actions button{border:0;border-radius:8px;padding:9px 13px;font:700 12px 'Noto Sans KR',sans-serif;cursor:pointer}.link-save{background:#16784F;color:#fff}.link-cancel{background:var(--pale);color:var(--navy)}@media(max-width:540px){.shell{padding-top:28px}.item{padding:15px;grid-template-columns:1fr}.go{display:none}.item-tools{opacity:1}.section-head{align-items:start;flex-direction:column}.admin-add{align-self:flex-end}}html[data-theme="dark"] .search,html[data-theme="dark"] .item,html[data-theme="dark"] .link-card{background:#1A2233;border-color:#3B4860}html[data-theme="dark"] .item h2,html[data-theme="dark"] .link-card h2{color:#F4F7FF}html[data-theme="dark"] .item p,html[data-theme="dark"] .note{color:#B8C6DF}html[data-theme="dark"] .link-card input,html[data-theme="dark"] .link-card textarea{background:#202B40;border-color:#4A5C7C;color:#EAF1FF}
  </style><style>header{visibility:hidden}</style><script src="theme.js"></script><script src="loading.js"></script>
</head><body>
  <header class="head"><a class="back" href="index.html" aria-label="메인으로">‹</a><div class="brand"><img src="logo.png" alt="로고"><div><b>도개중고등학교 정보 허브</b><small>RESOURCE LIBRARY</small></div></div></header>
  <main class="shell"><div class="section-head"><div><span class="eyebrow">RESOURCE LIBRARY</span><h1 class="title">유용한 자료 모음</h1><p class="intro">관리자가 공유한 자료를 Google Drive에서 바로 내려받을 수 있습니다.</p></div><button class="admin-add" id="addResource" hidden>＋ Google Drive 자료 등록</button></div><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="query" type="search" autocomplete="off" placeholder="제목, 설명 또는 태그로 검색"></div><p class="result" id="result">자료를 불러오는 중입니다.</p><section class="list" id="list"><div class="empty">자료를 불러오는 중입니다.</div></section></main>
  <div class="link-modal" id="resourceModal" hidden><form class="link-card" id="resourceForm"><h2>Google Drive 자료 등록</h2><label for="resourceTitle">제목</label><input id="resourceTitle" maxlength="80" required><label for="resourceDriveUrl">Google Drive 파일 공유 링크</label><input id="resourceDriveUrl" type="url" placeholder="https://drive.google.com/file/d/..." maxlength="1000" required><p class="note">먼저 Google Drive에 파일을 올린 후 파일의 공유 링크를 붙여넣으세요. 내려받을 교사가 열 수 있도록 공유 범위를 설정해야 합니다.</p><label for="resourceDesc">설명 (선택)</label><textarea id="resourceDesc" maxlength="240"></textarea><label for="resourceTags">태그 (쉼표로 구분, 최대 10개)</label><input id="resourceTags" maxlength="200" placeholder="예: 가정통신문, 평가, 연수"><div class="link-form-actions"><button class="link-cancel" type="button" id="resourceCancel">취소</button><button class="link-save" type="submit" id="resourceSave">자료 등록</button></div></form></div>
  <script>
    let resources=[],signature='',loaded=false;const colors=['#16784F','#253E8A','#B5500A','#6B3FA0','#3E6B8A'];const esc=v=>String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');const admin=()=>sessionStorage.getItem('isAdmin')==='true';const tags=item=>(Array.isArray(item.tags)?item.tags:[]).filter(Boolean);function openLink(url){const popup=window.open(url,'_blank');if(popup)popup.opener=null}function render(){const q=$('query').value.trim().toLowerCase(),canEdit=admin();$('addResource').hidden=!canEdit;if(!loaded)return;const found=resources.filter(item=>!q||[item.title,item.desc,tags(item).join(' ')].join(' ').toLowerCase().includes(q));$('result').textContent=q?`“${$('query').value}” 검색 결과 ${found.length}개`:`등록된 자료 ${found.length}개`;$('list').innerHTML=found.length?found.map((item,index)=>`<article class="item" role="link" tabindex="0" data-download="${esc(item.id)}" style="--color:${colors[index%colors.length]}"><span><h2>${esc(item.title)}</h2><p>${esc(item.desc||'설명이 등록되지 않았습니다.')}</p>${tags(item).length?`<div class="tags">${tags(item).map(tag=>`<span class="tag"># ${esc(tag)}</span>`).join('')}</div>`:''}</span>${canEdit?`<span class="item-tools"><button type="button" data-delete="${esc(item.id)}">삭제</button></span>`:'<span class="go">다운로드 ↓</span>'}</article>`).join(''):'<div class="empty">조건에 맞는 자료가 없습니다.</div>';$('list').querySelectorAll('[data-download]').forEach(card=>{card.onclick=e=>{if(!e.target.closest('.item-tools'))openLink('/api/dashboard?scope=resource-download&id='+encodeURIComponent(card.dataset.download))};card.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.item-tools')){e.preventDefault();card.click()}};});$('list').querySelectorAll('[data-delete]').forEach(button=>button.onclick=async e=>{e.stopPropagation();if(!confirm('이 자료를 삭제할까요?'))return;const r=await fetch('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'resource:delete',id:button.dataset.delete})}),data=await r.json();if(!r.ok)return alert(data.error||'삭제하지 못했습니다.');signature='';sync()})}function $(id){return document.getElementById(id)}async function sync(){try{const r=await fetch('/api/dashboard'),data=await r.json();if(!r.ok)throw Error(data.error);const next=JSON.stringify(data.resources||[]);loaded=true;if(next===signature)return;signature=next;resources=data.resources||[];render()}catch(error){loaded=true;$('result').textContent='';$('list').innerHTML='<div class="empty">자료를 불러오지 못했습니다.</div>';console.warn(error)}}function close(){ $('resourceModal').hidden=true;$('resourceForm').reset()}$('query').oninput=render;$('addResource').onclick=()=>{$('resourceModal').hidden=false;$('resourceTitle').focus()};$('resourceCancel').onclick=close;$('resourceModal').onclick=e=>{if(e.target===e.currentTarget)close()};$('resourceForm').onsubmit=async e=>{e.preventDefault();const button=$('resourceSave');button.disabled=true;button.textContent='등록 중...';try{const data={title:$('resourceTitle').value.trim(),driveUrl:$('resourceDriveUrl').value.trim(),desc:$('resourceDesc').value.trim(),tags:[...new Set($('resourceTags').value.split(',').map(tag=>tag.trim()).filter(Boolean))]},r=await fetch('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'resource:save',data})}),result=await r.json();if(!r.ok)throw Error(result.error||'자료를 등록하지 못했습니다.');close();signature='';await sync()}catch(error){alert(error.message)}finally{button.disabled=false;button.textContent='자료 등록'}};window.addEventListener('hub-admin-change',render);sync();
  </script><script src="nav.js"></script>
</body></html>
