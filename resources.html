<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>유용한 자료 모음 · 도개중고등학교</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#253E8A;--deep:#17245D;--pale:#EEF2FB;--bg:#F3F5FA;--line:#DCE2F0;--text:#1B253D;--muted:#68748A;--green:#16784F}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif}.head{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 clamp(16px,4vw,52px);gap:14px}.back{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;text-decoration:none;color:var(--navy);font-size:23px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:35px;height:35px}.brand b,.title,.form-card h2{font-family:'Noto Serif KR',serif;color:var(--deep)}.brand b{font-size:16px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.shell{width:100%;padding:42px clamp(16px,4vw,52px) 60px}.eyebrow{color:var(--navy);font-size:11px;font-weight:700;letter-spacing:.12em}.title{font-size:clamp(27px,4vw,38px);margin:7px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px}.section-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.view-switch{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:10px;background:#fff}.view-switch button{border:0;border-radius:7px;background:transparent;color:var(--muted);padding:7px 9px;font:700 11px 'Noto Sans KR',sans-serif;cursor:pointer}.view-switch button.active{background:#E8F6F0;color:var(--green)}.admin-add{border:0;border-radius:9px;background:var(--green);color:#fff;padding:10px 13px;font:700 12px 'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap}.admin-add[hidden]{display:none}.search{display:flex;align-items:center;gap:10px;margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:0 15px;box-shadow:0 6px 20px rgba(26,43,91,.05)}.search svg{width:18px;color:var(--muted)}.search input{width:100%;border:0;outline:0;padding:15px 0;font:inherit;font-size:14px;background:transparent}.result{font-size:12px;color:var(--muted);margin:16px 2px}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-left:5px solid var(--color,var(--green));border-radius:13px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;cursor:pointer}.item h2{font-size:16px;margin:0 0 6px;color:var(--deep);word-break:keep-all}.item p{font-size:13px;line-height:1.6;color:var(--muted);margin:0;word-break:keep-all}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.tag{border-radius:999px;padding:3px 7px;background:#E8F6F0;color:var(--green);font-size:10px;font-weight:700}.go{color:var(--green);font-size:13px;font-weight:700;white-space:nowrap}.item-tools{display:flex;gap:6px;opacity:0}.item:hover .item-tools,.item:focus-within .item-tools{opacity:1}.item-tools button{border:1px solid var(--line);border-radius:7px;background:#fff;padding:6px 8px;font:700 11px 'Noto Sans KR',sans-serif;cursor:pointer}.item-tools .edit{color:var(--navy)}.item-tools .delete{color:#B4232D}.empty{background:#fff;border:1px dashed #B8C3DB;border-radius:13px;text-align:center;padding:80px 20px;color:var(--muted);font-size:13px}.list.view-icon{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.list.view-icon .item{min-height:112px;border-left:1px solid var(--line);border-top:4px solid var(--color,var(--green));padding:18px 14px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}.list.view-icon .item h2{font-size:13px;line-height:1.45;margin:0}.list.view-icon .item p,.list.view-icon .tags,.list.view-icon .go{display:none}.list.view-icon .item-tools{position:absolute;right:7px;top:7px}.list.view-list{gap:7px}.list.view-list .item{border-left:4px solid var(--color,var(--green));padding:12px 15px;grid-template-columns:auto minmax(0,1fr) auto;gap:11px}.list-index{font-size:11px;font-weight:800;color:var(--color,var(--green));min-width:22px}.list.view-list .item h2{font-size:14px;margin:0}.list.view-list .item p{font-size:11px;margin:3px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list.view-list .tags{display:none}.list.view-list .go{font-size:11px}.modal{position:fixed;inset:0;z-index:950;background:rgba(13,24,56,.38);display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.form-card{width:min(500px,100%);border-radius:16px;background:#fff;padding:24px;box-shadow:0 20px 55px rgba(12,24,59,.25)}.form-card h2{margin:0 0 15px;font-size:20px}.form-card label{display:block;margin:11px 0 5px;font-size:12px;font-weight:700}.form-card input,.form-card textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}.form-card textarea{min-height:86px;resize:vertical}.note{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.6}.form-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}.form-actions button{border:0;border-radius:8px;padding:9px 13px;font:700 12px 'Noto Sans KR',sans-serif;cursor:pointer}.save{background:var(--green);color:#fff}.cancel{background:var(--pale);color:var(--navy)}html[data-theme="dark"] .search,html[data-theme="dark"] .item,html[data-theme="dark"] .form-card,html[data-theme="dark"] .view-switch{background:#1A2233;border-color:#3B4860}html[data-theme="dark"] .item h2,html[data-theme="dark"] .form-card h2{color:#F4F7FF}html[data-theme="dark"] .item p,html[data-theme="dark"] .note{color:#B8C6DF}html[data-theme="dark"] .form-card input,html[data-theme="dark"] .form-card textarea{background:#202B40;border-color:#4A5C7C;color:#EAF1FF}html[data-theme="dark"] .view-switch button{color:#B8C6DF}html[data-theme="dark"] .view-switch button.active{background:#1F4A3A;color:#B9F0D0}@media(max-width:540px){.shell{padding-top:28px}.section-head{align-items:start;flex-direction:column}.section-actions{width:100%;justify-content:space-between}.list.view-icon{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:15px;grid-template-columns:1fr}.go{display:none}.item-tools{opacity:1}.list.view-list .item-tools{opacity:1}}
  </style><style>header{visibility:hidden}</style><script src="theme.js"></script><script src="loading.js"></script>
</head><body>
  <header class="head"><a class="back" href="index.html" aria-label="메인으로">‹</a><div class="brand"><img src="logo.png" alt="로고"><div><b>도개중고등학교 정보 허브</b><small>RESOURCE LIBRARY</small></div></div></header>
  <main class="shell"><div class="section-head"><div><span class="eyebrow">RESOURCE LIBRARY</span><h1 class="title">유용한 자료 모음</h1></div><div class="section-actions"><div class="view-switch" role="group" aria-label="자료 보기 모드"><button type="button" data-view-mode="icon">▦ 아이콘</button><button type="button" data-view-mode="list">☷ 리스트</button><button type="button" data-view-mode="detail">☰ 상세</button></div><button class="admin-add" id="addResource" hidden>＋ Google Drive 자료 등록</button></div></div><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="query" type="search" autocomplete="off" placeholder="제목, 설명 또는 태그로 검색"></div><p class="result" id="result">자료를 불러오는 중입니다.</p><section class="list view-detail" id="list"><div class="empty">자료를 불러오는 중입니다.</div></section></main>
  <div class="modal" id="resourceModal" hidden><form class="form-card" id="resourceForm"><h2 id="resourceModalTitle">Google Drive 자료 등록</h2><label for="resourceTitle">제목</label><input id="resourceTitle" maxlength="80" required><label for="resourceDriveUrl">Google Drive 파일 공유 링크</label><input id="resourceDriveUrl" type="url" placeholder="https://drive.google.com/file/d/..." maxlength="1000" required><p class="note">먼저 Google Drive에 파일을 올린 후 파일의 공유 링크를 붙여넣으세요. 내려받을 교사가 열 수 있도록 공유 범위를 설정해야 합니다.</p><label for="resourceDesc">설명 (선택)</label><textarea id="resourceDesc" maxlength="240"></textarea><label for="resourceTags">태그 (쉼표로 구분, 최대 10개)</label><input id="resourceTags" maxlength="200" placeholder="예: 가정통신문, 평가, 연수"><div class="form-actions"><button class="cancel" type="button" id="resourceCancel">취소</button><button class="save" type="submit" id="resourceSave">자료 등록</button></div></form></div>
  <script>
    const $=id=>document.getElementById(id),colors=['#16784F','#253E8A','#B5500A','#6B3FA0','#3E6B8A'],admin=()=>sessionStorage.getItem('isAdmin')==='true',esc=v=>String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    let resources=[],signature='',loaded=false,editingResourceId='',viewMode=['icon','list','detail'].includes(localStorage.getItem('dogae-hub-resource-view'))?localStorage.getItem('dogae-hub-resource-view'):'detail';
    const tags=item=>(Array.isArray(item.tags)?item.tags:[]).filter(Boolean);
    function openLink(url){const popup=window.open(url,'_blank');if(popup)popup.opener=null}
    function updateViewControls(){document.querySelectorAll('[data-view-mode]').forEach(button=>{const active=button.dataset.viewMode===viewMode;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))})}
    function resourceCard(item,index,canEdit){const tools=canEdit?`<span class="item-tools"><button class="edit" type="button" data-edit="${esc(item.id)}">수정</button><button class="delete" type="button" data-delete="${esc(item.id)}">삭제</button></span>`:'<span class="go">다운로드 ↓</span>',tagHtml=tags(item).length?`<div class="tags">${tags(item).map(tag=>`<span class="tag"># ${esc(tag)}</span>`).join('')}</div>`:'';if(viewMode==='icon')return `<article class="item" role="link" tabindex="0" data-download="${esc(item.id)}" style="--color:${colors[index%colors.length]}"><span><h2>${esc(item.title)}</h2></span>${tools}</article>`;if(viewMode==='list')return `<article class="item" role="link" tabindex="0" data-download="${esc(item.id)}" style="--color:${colors[index%colors.length]}"><span class="list-index">${String(index+1).padStart(2,'0')}</span><span><h2>${esc(item.title)}</h2><p>Google Drive 자료</p></span>${tools}</article>`;return `<article class="item" role="link" tabindex="0" data-download="${esc(item.id)}" style="--color:${colors[index%colors.length]}"><span><h2>${esc(item.title)}</h2><p>${esc(item.desc||'설명이 등록되지 않았습니다.')}</p>${tagHtml}</span>${tools}</article>`}
    function render(){const q=$('query').value.trim().toLowerCase(),canEdit=admin();$('addResource').hidden=!canEdit;updateViewControls();$('list').className='list view-'+viewMode;if(!loaded)return;const found=resources.filter(item=>!q||[item.title,item.desc,tags(item).join(' ')].join(' ').toLowerCase().includes(q));$('result').textContent=q?`“${$('query').value}” 검색 결과 ${found.length}개`:`등록된 자료 ${found.length}개`;$('list').innerHTML=found.length?found.map((item,index)=>resourceCard(item,index,canEdit)).join(''):'<div class="empty">조건에 맞는 자료가 없습니다.</div>';$('list').querySelectorAll('[data-download]').forEach(card=>{card.onclick=e=>{if(!e.target.closest('.item-tools'))openLink('/api/dashboard?scope=resource-download&id='+encodeURIComponent(card.dataset.download))};card.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.item-tools')){e.preventDefault();card.click()}}});$('list').querySelectorAll('[data-edit]').forEach(button=>button.onclick=e=>{e.stopPropagation();openEditor(resources.find(item=>item.id===button.dataset.edit))});$('list').querySelectorAll('[data-delete]').forEach(button=>button.onclick=e=>{e.stopPropagation();removeResource(button.dataset.delete)})}
    async function sync(){try{const response=await fetch('/api/dashboard'),data=await response.json();if(!response.ok)throw Error(data.error);const next=JSON.stringify(data.resources||[]);loaded=true;if(next===signature)return;signature=next;resources=data.resources||[];render()}catch(error){loaded=true;$('result').textContent='';$('list').innerHTML='<div class="empty">자료를 불러오지 못했습니다.</div>';console.warn(error)}}
    function openEditor(item){if(!admin())return;editingResourceId=item?.id||'';$('resourceModalTitle').textContent=item?'Google Drive 자료 수정':'Google Drive 자료 등록';$('resourceTitle').value=item?.title||'';$('resourceDriveUrl').value=item?.driveUrl||'';$('resourceDesc').value=item?.desc||'';$('resourceTags').value=item?tags(item).join(', '):'';$('resourceSave').textContent=item?'수정 저장':'자료 등록';$('resourceModal').hidden=false;$('resourceTitle').focus()}
    function closeEditor(){$('resourceModal').hidden=true;$('resourceForm').reset();editingResourceId=''}
    async function removeResource(id){if(!admin()||!confirm('이 자료를 삭제할까요?'))return;const response=await fetch('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'resource:delete',id})}),data=await response.json();if(!response.ok)return alert(data.error||'삭제하지 못했습니다.');signature='';await sync()}
    $('query').oninput=render;document.querySelectorAll('[data-view-mode]').forEach(button=>button.onclick=()=>{viewMode=button.dataset.viewMode;localStorage.setItem('dogae-hub-resource-view',viewMode);render()});$('addResource').onclick=()=>openEditor(null);$('resourceCancel').onclick=closeEditor;$('resourceModal').onclick=e=>{if(e.target===e.currentTarget)closeEditor()};$('resourceForm').onsubmit=async e=>{e.preventDefault();const button=$('resourceSave');button.disabled=true;button.textContent='저장 중...';try{const data={title:$('resourceTitle').value.trim(),driveUrl:$('resourceDriveUrl').value.trim(),desc:$('resourceDesc').value.trim(),tags:[...new Set($('resourceTags').value.split(',').map(tag=>tag.trim()).filter(Boolean))]},response=await fetch('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'resource:save',id:editingResourceId,data})}),result=await response.json();if(!response.ok)throw Error(result.error||'자료를 저장하지 못했습니다.');closeEditor();signature='';await sync()}catch(error){alert(error.message)}finally{button.disabled=false;button.textContent=editingResourceId?'수정 저장':'자료 등록'}};window.addEventListener('hub-admin-change',render);sync();
  </script><script src="nav.js"></script>
</body></html>
