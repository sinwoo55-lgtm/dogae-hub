<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>도개중고등학교 시간표 교체</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#253E8A;--deep:#17245D;--pale:#EEF2FB;--bg:#F3F5FA;--line:#DCE2F0;--text:#1B253D;--muted:#68748A;--red:#B4232D}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif}.head{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 clamp(16px,4vw,52px);gap:14px}.back{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;text-decoration:none;color:var(--navy);font-size:23px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:35px;height:35px}.brand b{font-family:'Noto Serif KR',serif;color:var(--deep);font-size:16px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.shell{max-width:1260px;margin:0 auto;padding:42px clamp(16px,4vw,52px) 60px}.eyebrow{color:var(--navy);font-size:11px;font-weight:700;letter-spacing:.12em}.title{font-family:'Noto Serif KR',serif;color:var(--deep);font-size:clamp(27px,4vw,38px);margin:7px 0}.intro{color:var(--muted);font-size:13px;margin:0 0 24px;line-height:1.7}.upload{display:none;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff}.upload.show{display:flex}.upload b{font-size:13px;color:var(--deep)}.upload small{color:var(--muted);font-size:11px;flex:1;min-width:190px}.upload input{max-width:260px;font-size:11px}.btn{border:0;border-radius:9px;background:var(--navy);color:#fff;padding:10px 13px;font:700 12px 'Noto Sans KR',sans-serif;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 7px 23px rgba(25,43,106,.05)}.side{padding:18px}.side label{display:block;font-size:12px;font-weight:700;color:var(--deep);margin-bottom:8px}.side select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;font:13px 'Noto Sans KR',sans-serif}.source{margin:13px 0;color:var(--muted);font-size:11px;line-height:1.6}.selected{padding:11px;border-radius:9px;background:var(--pale);color:var(--navy);font-size:12px;line-height:1.55;min-height:57px}.main{padding:20px;min-width:0}.grid{overflow:auto}.timetable{min-width:760px;display:grid;grid-template-columns:80px repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden}.timetable>span,.timetable button{min-height:52px;padding:7px;background:#fff;border:0;text-align:left;font:11px 'Noto Sans KR',sans-serif;color:var(--text)}.timetable>.day{background:var(--pale);text-align:center;font-weight:800;color:var(--navy);min-height:34px}.timetable>.period{background:#F8F9FC;text-align:center;font-weight:700;color:var(--muted)}.timetable button{cursor:pointer;white-space:pre-line;line-height:1.35}.timetable button:hover{background:#F5F7FF}.timetable button.class{box-shadow:inset 3px 0 0 #6F8CD0}.timetable button.selected{background:#E3EBFF;box-shadow:inset 0 0 0 2px var(--navy);color:var(--deep);font-weight:700}.timetable button:disabled{cursor:default;background:#FAFBFD}.find{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}.hint{font-size:11px;color:var(--muted)}.result{margin-top:18px}.result h2{font:700 17px 'Noto Serif KR',serif;color:var(--deep);margin:0 0 10px}.result-list{display:grid;gap:8px}.option{display:grid;grid-template-columns:1fr auto 1.2fr;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px}.option b{display:block;color:var(--deep);font-size:14px}.option small{color:var(--muted)}.arrow{color:var(--navy);font-size:18px}.empty{padding:30px 16px;border:1px dashed #B8C3DB;border-radius:12px;text-align:center;color:var(--muted);font-size:13px}.error{color:var(--red)}@media(max-width:780px){.shell{padding-top:28px}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}.side label,.source,.selected{margin:0}.find{align-items:stretch;flex-direction:column}.btn{width:100%}.option{grid-template-columns:1fr;gap:5px}.arrow{display:none}}
    .stage{padding:24px}.stage[hidden]{display:none}.stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.stage-head b{display:block;color:var(--deep);font:700 19px 'Noto Serif KR',serif}.stage-head small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.teacher-search{width:min(680px,100%);margin:0 auto}.teacher-search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:14px 'Noto Sans KR',sans-serif;outline:0}.teacher-search input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(37,62,138,.1)}.teacher-notice{display:block;min-height:18px;margin:7px 2px 0;color:var(--muted);font-size:11px}.teacher-notice.ready{color:var(--navy);font-weight:700}.stage-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:18px}.plain-btn{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);padding:8px 10px;font:700 11px 'Noto Sans KR',sans-serif;cursor:pointer}.timetable>span,.timetable button{display:grid;place-items:center;text-align:center}.timetable button{white-space:pre-line}.timetable button.class{background:#EAF1FF;color:#183A7A;box-shadow:inset 3px 0 0 #4774C9}.timetable button.free{background:#F4F6F9;color:#99A4B6}.timetable button.selected{background:#C9DAFF;box-shadow:inset 0 0 0 2px var(--navy);color:var(--deep);font-weight:700}.swap-group{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}.swap-group+.swap-group{margin-top:10px}.swap-group-head{padding:12px 14px;background:var(--pale);color:var(--deep)}.swap-group-head b{font-size:15px}.swap-slots{display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:#fff}.swap-slot{flex:0 1 210px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}.swap-slot b{display:block;color:var(--deep);font-size:13px}.swap-slot small{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.45}@media(max-width:780px){.stage{padding:18px}.stage-head{align-items:flex-start;flex-direction:column}.stage-actions{align-items:stretch;flex-direction:column}.plain-btn{align-self:flex-end}.swap-slot{flex-basis:100%}}
  </style>
</head>
<body>
  <header class="head"><a class="back" href="index.html" aria-label="메인으로">‹</a><div class="brand"><img src="logo.png" alt="도개중고등학교 로고"><div><b>도개중고등학교</b><small>TEACHER TIMETABLE SWAP</small></div></div></header>
  <main class="shell"><div class="eyebrow">TEACHER SUPPORT</div><h1 class="title">시간표 교체</h1>
    <section class="upload" id="uploadBox"><b>관리자 시간표 업로드</b><small>학기별 교사 전체 시간표(.xlsx)를 업로드하면 기존 시간표가 교체됩니다.</small><input id="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><button class="btn" id="uploadBtn">시간표 반영</button></section>
    <section class="card stage" id="step1"><div class="stage-head"><div><b>교사 선택</b><small>성명을 입력해 교사를 찾으세요.</small></div></div><div class="teacher-search"><input id="teacherSearch" list="teacherNames" type="search" placeholder="교사 성명 검색" autocomplete="off"><datalist id="teacherNames"></datalist><small class="teacher-notice" id="teacherNotice"></small></div><div class="stage-actions"><button class="btn" id="nextToSchedule" disabled>다음 단계</button></div></section>
    <section class="card stage" id="step2" hidden><div class="stage-head"><div><b>교체 희망 시간 선택</b><small id="teacherSummary"></small></div><button class="plain-btn" id="backToTeacher">교사 다시 선택</button></div><div class="grid" id="grid"></div><div class="stage-actions"><span class="hint">파란색은 수업, 회색은 공강입니다.</span><button class="btn" id="findBtn" disabled>교체 가능 조회</button></div></section>
    <section class="card stage" id="step3" hidden><div class="stage-head"><div><b>교체 가능 시간표</b><small id="resultSummary"></small></div><button class="plain-btn" id="backToSchedule">시간 다시 선택</button></div><div class="result" id="result"></div></section>
  </main>
  <script src="theme.js"></script><script src="nav.js"></script>
  <script>
    const $=id=>document.getElementById(id),days=['월','화','수','목','금'];let timetable=null,selected=null,chosenTeacherId='',step=1;
    const esc=value=>String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    function currentTeacher(){return timetable?.teachers.find(item=>item.id===chosenTeacherId)}function at(teacher,day,period){return teacher?.hours.find(item=>item.day===day&&Number(item.period)===period)}
    function setStep(next){step=next;[1,2,3].forEach(number=>{$('step'+number).hidden=number!==step});window.scrollTo({top:0,behavior:'smooth'})}
    function resolveTeacher(){const query=$('teacherSearch').value.trim(),matches=query?(timetable?.teachers||[]).filter(item=>item.name.includes(query)):[],exact=matches.find(item=>item.name===query);$('teacherNames').innerHTML=matches.map(item=>`<option value="${esc(item.name)}"></option>`).join('');chosenTeacherId=(exact||matches.length===1?exact||matches[0]:null)?.id||'';$('nextToSchedule').disabled=!chosenTeacherId;const notice=$('teacherNotice');notice.textContent=!query?'교사 성명을 입력하세요.':chosenTeacherId?`${currentTeacher().name} 선생님이 선택되었습니다.`:matches.length?'이름을 더 입력해 한 명의 교사를 선택하세요.':'일치하는 교사가 없습니다.';notice.classList.toggle('ready',Boolean(chosenTeacherId))}
    function renderGrid(){const teacher=currentTeacher();if(!teacher){$('grid').innerHTML='<div class="empty">시간표를 불러오지 못했습니다.</div>';return}$('teacherSummary').textContent=teacher.name+' 선생님의 시간표에서 교체할 수업을 선택하세요.';let html='<div class="timetable"><span class="day"></span>'+days.map(day=>'<span class="day">'+day+'</span>').join('');for(let period=1;period<=7;period++){html+='<span class="period">'+period+'교시</span>';for(const day of days){const item=at(teacher,day,period),isSelected=selected&&selected.day===day&&selected.period===period;html+=`<button type="button" class="${item?.classCode?'class':'free'} ${isSelected?'selected':''}" data-day="${day}" data-period="${period}" ${item?.classCode?'':'disabled'}>${item?esc(item.label):'공강'}</button>`}}$('grid').innerHTML=html+'</div>';$('grid').querySelectorAll('button:not(:disabled)').forEach(button=>button.onclick=()=>{selected={day:button.dataset.day,period:Number(button.dataset.period)};$('findBtn').disabled=false;renderGrid()})}
    function render(){chosenTeacherId='';selected=null;$('teacherSearch').value='';$('teacherNames').innerHTML='';$('nextToSchedule').disabled=true;$('findBtn').disabled=true;resolveTeacher();setStep(1)}
    function renderResults(){const source=currentTeacher(),slot=selected&&at(source,selected.day,selected.period);if(!slot?.classCode)return;const groups=new Map();for(const candidate of timetable.teachers){if(candidate.id===source.id||at(candidate,slot.day,slot.period))continue;const slots=candidate.hours.filter(item=>item.classCode===slot.classCode&&!at(source,item.day,item.period));if(slots.length)groups.set(candidate,slots)}$('resultSummary').textContent=`${source.name} 선생님의 ${slot.day}요일 ${slot.period}교시 ${slot.classCode} 수업`;if(!groups.size){$('result').innerHTML='<div class="empty">조건을 모두 만족하는 교체 가능 시간표가 없습니다.</div>';return}const dayOrder=day=>days.indexOf(day);$('result').innerHTML=[...groups].map(([teacher,slots])=>`<article class="swap-group"><div class="swap-group-head"><b>${esc(teacher.name)} 선생님</b></div><div class="swap-slots">${slots.sort((a,b)=>dayOrder(a.day)-dayOrder(b.day)||a.period-b.period).map(item=>`<div class="swap-slot"><b>${item.day}요일 ${item.period}교시</b><small>${esc(item.label).replace(/\n/g,' · ')}</small></div>`).join('')}</div></article>`).join('')}
    async function load(){try{const response=await fetch('/api/dashboard?scope=timetable'),data=await response.json();if(!response.ok)throw Error(data.error||'시간표를 불러오지 못했습니다.');timetable=data.timetable&&data.timetable.teachers?data.timetable:null;render()}catch(error){$('teacherNotice').textContent=error.message;$('teacherNotice').classList.add('error')}}
    $('teacherSearch').oninput=resolveTeacher;$('nextToSchedule').onclick=()=>{selected=null;$('findBtn').disabled=true;renderGrid();setStep(2)};$('backToTeacher').onclick=()=>setStep(1);$('backToSchedule').onclick=()=>setStep(2);$('findBtn').onclick=()=>{renderResults();setStep(3)};
    function updateAdminUi(){$('uploadBox').classList.toggle('show',sessionStorage.getItem('isAdmin')==='true')}window.addEventListener('hub-admin-change',updateAdminUi);updateAdminUi();$('uploadBtn').onclick=async()=>{const file=$('file').files[0];if(!file)return alert('xlsx 시간표 파일을 선택하세요.');const button=$('uploadBtn');button.disabled=true;button.textContent='시간표 분석 중...';try{const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)}),response=await fetch('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'timetable:save',data:{fileName:file.name,fileBase64:String(dataUrl).split(',')[1]}})}),data=await response.json();if(!response.ok)throw Error(data.error||'시간표를 반영하지 못했습니다.');timetable=data.timetable; timetable.sourceFileName=data.sourceFileName;render();alert('시간표를 반영했습니다.')}catch(error){alert(error.message)}finally{button.disabled=false;button.textContent='시간표 반영'}};load();
  </script>
</body></html>
